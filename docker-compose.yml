services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      DATABASE_URL: postgres://app_factory:app_factory@postgres:5432/app_factory_supervisor
      APP_DATA_DIR: /app/data
      APP_PROJECTS_DIR: /app/projects
    ports:
      - "${APP_PUBLISHED_PORT:-3090}:3000"
    volumes:
      - app_data:/app/data
      - app_projects:/app/projects
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: app_factory
      POSTGRES_PASSWORD: app_factory
      POSTGRES_DB: app_factory_supervisor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_factory -d app_factory_supervisor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_data:
  app_projects:
  postgres_data:
